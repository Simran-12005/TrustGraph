name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate synthetic data
        run: python data/generate_synthetic_data.py --n_customers 300 --n_days 60 --out_dir data

      - name: Build database
        run: python -m backend.db.db_utils

      - name: Run tests
        run: pytest tests/ -v

      - name: Smoke-test orchestrator on the spec's 4 example queries
        run: |
          python -c "
          from backend.agent.orchestrator import run_agent
          queries = [
              'Find structuring patterns in the last 30 days',
              'Which customers made 10 or more transactions under \$10,000?',
              'Is customer ID 00042 suspicious?',
              'Analyse this dataset for suspicious activity',
          ]
          for q in queries:
              result = run_agent(q, top_n=3)
              assert 'execution_plan' in result
              assert 'flagged_items' in result
              print(f'OK: {q} -> {result[\"execution_plan\"][\"query_type\"]}')
          "
