        <script type="text/javascript">

              // initialize global variables.
              var edges;
              var nodes;
              var allNodes;
              var allEdges;
              var nodeColors;
              var originalNodes;
              var network;
              var container;
              var options, data;
              var filter = {

              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#f87171", "font": {"color": "#f8fafc"}, "id": "CUST00009", "label": "CUST00009", "shape": "dot", "size": 25, "title": "Subject Customer: CUST00009"}, {"color": "#fbbf24", "font": {"color": "#f8fafc"}, "id": "DEV_RING", "label": "DEV_RING_99", "shape": "dot", "size": 18, "title": "Shared Device Fingerprint"}, {"color": "#38bdf8", "font": {"color": "#f8fafc"}, "id": "IP_SUBNET", "label": "IP_192.168.100", "shape": "dot", "size": 18, "title": "Shared Proxy IP Subnet"}, {"color": "#a855f7", "font": {"color": "#f8fafc"}, "id": "MULE_01", "label": "CUST00039", "shape": "dot", "size": 15, "title": "Connected Mule Account"}]);
                  edges = new vis.DataSet([{"from": "CUST00009", "to": "DEV_RING", "weight": 2}, {"from": "CUST00009", "to": "IP_SUBNET", "weight": 2}, {"from": "DEV_RING", "to": "MULE_01", "weight": 1}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {
    "configure": {
        "enabled": false
    },
    "edges": {
        "color": {
            "inherit": true
        },
        "smooth": {
            "enabled": true,
            "type": "dynamic"
        }
    },
    "interaction": {
        "dragNodes": true,
        "hideEdgesOnDrag": false,
        "hideNodesOnDrag": false
    },
    "physics": {
        "enabled": true,
        "stabilization": {
            "enabled": true,
            "fit": true,
            "iterations": 1000,
            "onlyDynamicEdges": false,
            "updateInterval": 50
        }
    }
};

                  


                  

                  network = new vis.Network(container, data, options);

                  

                  

                  


                  

                  return network;

              }
              drawGraph();
